# Adapt and copy to .github/workflows/ai-handoff-check.yml in a game repository.
# Checks the committed handoff record only. It does NOT run Unity, certify test
# reports, or prove the game works. Keep existing Unity/build checks separately.
name: ai-handoff-check
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  ai-handoff-check:
    runs-on: ubuntu-latest
    steps:
      # Check the PR head commit itself, not GitHub's synthetic merge commit.
      # Full history is needed so Reviewed-Commit can be resolved.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Helper tests
        run: python3 -B -m unittest discover -s tools/ai/tests
      - name: Committed handoff record
        run: python3 -B tools/ai/check_handoff.py --ref HEAD
