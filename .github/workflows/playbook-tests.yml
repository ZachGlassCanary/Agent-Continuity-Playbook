name: playbook-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helper-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run helper tests
        run: python -B -m unittest discover -s checks/tests
